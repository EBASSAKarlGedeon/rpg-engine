<div class="rpg-engine-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>RPG Engine</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div>
                <input id="rpg_engine_checkbox" type="checkbox" />
                <label for="rpg_engine_checkbox">Enable RPG Engine</label>
            </div>
            <p><small>Toggle this and refresh - it should remember your choice.</small></p>
            <div>
                <input id="rpg_engine_button" class="menu_button" type="submit" value="Test Button" />
            </div>
            <p>✅ Extension loaded successfully!</p>
            <p>If you can see this, the basic structure is working.</p>
        </div>
    </div>
</div>
