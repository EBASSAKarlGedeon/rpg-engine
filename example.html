<div class="rpg-engine-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>RPG Engine</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div>
                <input id="rpg_engine_button" class="menu_button" type="submit" value="Open RPG Engine" />
                <input id="rpg_engine_bridge" class="menu_button" type="submit" value="AI Model settings" />
                <input id="rpg_engine_import" class="menu_button" type="submit" value="Import from Loreweaver" />
            </div>
            <p>The game routes its AI calls through Loreweaver's Connection Manager, so provider keys
               stay server-side. <b>Import from Loreweaver</b> brings personas, character cards, world
               info and chats into the game; <b>AI Model settings</b> picks which model plays the GM.</p>
        </div>
    </div>
</div>
